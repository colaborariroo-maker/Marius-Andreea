<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Un cadou pentru tine ❤️</title>
<style>
:root{--bg:#120d14;--card:#20151f;--pink:#ff77ad;--pink2:#ffb6d2;--text:#fff7fb;--muted:#d9c7d0;--line:#4a3040}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:radial-gradient(circle at top,#3a1c31 0,#120d14 42%,#0c090d 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none} .wrap{max-width:980px;margin:auto;padding:18px}
nav{position:sticky;top:0;z-index:5;background:rgba(18,13,20,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow:auto;padding:10px 14px}
nav a{padding:9px 13px;border-radius:999px;white-space:nowrap;color:#f8dce8;font-size:14px} nav a:hover{background:#3a2030}
.hero{min-height:75vh;display:grid;place-items:center;text-align:center;padding:70px 12px 40px}
.hero-inner{max-width:780px} .heart{font-size:58px;animation:pulse 1.8s infinite} @keyframes pulse{50%{transform:scale(1.08)}}
h1{font-family:Georgia,serif;font-size:clamp(42px,8vw,76px);line-height:.98;margin:15px 0;color:#fff}
h2{font-family:Georgia,serif;font-size:34px;margin:0 0 10px} h3{margin:0 0 8px}
.lead{font-size:19px;color:var(--muted);line-height:1.6}
.btn{display:inline-block;border:0;border-radius:999px;padding:14px 22px;background:var(--pink);color:#28121d;font-weight:800;cursor:pointer;margin-top:12px}
.btn.secondary{background:#33202c;color:#fff;border:1px solid #69455a}
section{padding:38px 0;scroll-margin-top:70px} .section-head{margin-bottom:18px} .section-head p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.photo-card,.video-card,.panel{background:rgba(32,21,31,.9);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.photo-card img{width:100%;height:250px;object-fit:cover;display:block} .photo-card div{padding:12px 14px;font-weight:700;color:#ffd9e8}
.video-card{padding:12px} .video-title{font-weight:800;margin:4px 4px 10px} video{width:100%;border-radius:14px;background:#000;display:block}
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:16px} .panel{padding:22px}
@media(max-width:700px){.quiz{grid-template-columns:1fr} .photo-card img{height:230px}}
.option{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 15px;border-radius:14px;border:1px solid #654457;background:#291b26;color:#fff;cursor:pointer}
.option:hover{border-color:var(--pink)} .result{margin-top:12px;padding:13px;border-radius:14px;background:#351d2c;color:#ffd9e8;display:none}
.letter{font-family:Georgia,serif;font-size:20px;line-height:1.8;color:#fbeef4}
.final{text-align:center;background:linear-gradient(145deg,#2b1726,#171017);border:1px solid #684459;border-radius:28px;padding:38px 24px}
.small{font-size:13px;color:#ad929e} footer{padding:35px 0 60px;text-align:center;color:#a9909c}
input,textarea{width:100%;background:#171016;color:white;border:1px solid #624154;border-radius:14px;padding:13px;font:inherit;margin-top:8px} textarea{min-height:100px;resize:vertical}
.floating-hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.float-heart{position:absolute;bottom:-40px;font-size:22px;animation:floatUp linear forwards;opacity:.9}
@keyframes floatUp{0%{transform:translateY(0) scale(.7) rotate(0deg);opacity:0}12%{opacity:.9}100%{transform:translateY(-110vh) scale(1.25) rotate(25deg);opacity:0}}
.music-bar{position:fixed;right:14px;bottom:14px;z-index:30;background:rgba(32,21,31,.94);border:1px solid #765066;border-radius:999px;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.music-bar button{border:0;background:#ff77ad;color:#28121d;border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}
.music-name{font-size:12px;color:#f8dce8;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.romantic-gate{margin-top:25px;text-align:center;padding:28px 20px;border:1px solid #765066;border-radius:24px;background:radial-gradient(circle at center,#3a1b31,#20151f)}
.romantic-gate .big-heart{font-size:54px;animation:pulse 1.8s infinite}
body.music-on .music-bar{box-shadow:0 0 28px rgba(255,119,173,.35)}
.final.revealed{animation:finalIn .9s ease both}
@keyframes finalIn{from{opacity:.2;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}

</head>

<p class="letter">Dar știu că în câteva luni ai reușit să devii una dintre persoanele pe care abia aștept să le văd, să le aud și să le tachinez. Da... inclusiv despre nările tale. 😂👃</p>

<script>
const music=document.getElementById('bgMusic');
const musicToggle=document.getElementById('musicToggle');
const romanticBtn=document.getElementById('romanticBtn');

function toggleMusic(){
  if(music.paused){
    music.play().then(()=>{
      document.body.classList.add('music-on');
      musicToggle.textContent='Ⅱ Pauză';
    }).catch(()=>{
      musicToggle.textContent='▶ Apasă din nou';
    });
  }else{
    music.pause();
    document.body.classList.remove('music-on');
    musicToggle.textContent='♫ Pornește';
  }
}
musicToggle.addEventListener('click',toggleMusic);

function heartBurst(count=28){
  const holder=document.getElementById('hearts');
  const symbols=['❤️','💕','💗','💖','✨'];
  for(let i=0;i<count;i++){
    const h=document.createElement('span');
    h.className='float-heart';
    h.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    h.style.left=(Math.random()*100)+'vw';
    h.style.fontSize=(16+Math.random()*22)+'px';
    h.style.animationDuration=(3.5+Math.random()*3)+'s';
    h.style.animationDelay=(Math.random()*1.2)+'s';
    holder.appendChild(h);
    setTimeout(()=>h.remove(),7500);
  }
}
romanticBtn.addEventListener('click',()=>{
  if(music.paused){
    music.play().then(()=>{
      document.body.classList.add('music-on');
      musicToggle.textContent='Ⅱ Pauză';
    }).catch(()=>{});
  }
  heartBurst(38);
  const card=document.getElementById('finalCard');
  card.classList.add('revealed');
  document.getElementById('final').scrollIntoView({behavior:'smooth',block:'start'});
});
music.addEventListener('ended',()=>{
  musicToggle.textContent='♫ Pornește';
  document.body.classList.remove('music-on');
});

function revealMemory(){
  const el=document.getElementById('memoryReveal');
  el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'center'});
}
function firstPhoto(n){
  const el=document.getElementById('firstPhoto'+n);
  el.style.display='block';
  el.innerHTML = n===1
    ? 'Poate era doar o poză... dar pentru mine a fost unul dintre primele semne că îmi place să te am aproape. 🥹❤️'
    : 'Și uite-ne aici, câteva luni mai târziu: încă ne cunoaștem, încă ne tachinăm, încă ne atragem... și tocmai asta face povestea noastră frumoasă. 😏❤️';
}
const answers={};
function finalChoice(v){answers.final=v;const e=document.getElementById('finalChoice');e.style.display='block';e.textContent=v==='1'?'Știam eu. 😏 Pregătește-te pentru nările tale. 😂':v==='2'?'Și eu. ❤️':'Asta e combinația perfectă. 😂❤️';}
document.querySelectorAll('.option').forEach(btn=>{
 btn.addEventListener('click',()=>{
   const q=btn.dataset.q,v=btn.dataset.v; answers[q]=v;
   const box=document.getElementById(q); box.style.display='block';
   const messages={
     q1:'Indiferent ce ai ales... da, nările tale au ajuns aici. 😂❤️',
     q2:'Exact. Și promit să nu mă opresc prea curând. 😏❤️',
     q3:'Răspuns acceptat. Următoarea destinație o alegem împreună. 🌍',
     q4:'Răspunsul meu adevărat: toate variantele. ❤️',
     q5:'Asta voiam să aud. Amintirile noastre sunt partea cea mai frumoasă. 🥹'
   }; box.textContent=messages[q];
 });
});
document.getElementById('send').addEventListener('click',()=>{
 const free=document.getElementById('free').value.trim();
 const text=[
 'Răspunsurile mele la cadou ❤️',
 'Nările: '+(answers.q1||'nu am ales'),
 'Ce fac când zici nările: '+(answers.q2||'nu am ales'),
 'Locul: '+(answers.q3||'nu am ales'),
 'Ce îți place la mine: '+(answers.q4||'nu am ales'),
 'Ce aleg: '+(answers.q5||'nu am ales'),
 'Mesajul meu: '+(free||'—')
 ].join('\n');
 // SCHIMBĂ 316xxxxxxxx cu numărul tău WhatsApp, cu prefixul țării, fără +.
 const phone='316xxxxxxxx';
 window.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(text);
});
</script>
